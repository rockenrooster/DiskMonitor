name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build DiskMonitor.sln -c Release -nologo
      - name: Test
        run: dotnet test DiskMonitor.sln -c Release --no-build -nologo
      - name: Self-check
        shell: pwsh
        continue-on-error: true
        run: |
          $exe = "src\DiskMonitor\bin\Release\net10.0-windows\win-x64\DiskMonitor.exe"
          $p = Start-Process $exe -ArgumentList '--self-check' -Wait -PassThru -NoNewWindow -RedirectStandardOutput selfcheck.txt
          Get-Content selfcheck.txt
          exit $p.ExitCode
      - name: Publish the single-file executable
        run: dotnet publish src/DiskMonitor/DiskMonitor.csproj -c Release -r win-x64 --self-contained false -o publish -p:PublishSingleFile=true -p:PublishReadyToRun=true -nologo
      - name: Published executable starts
        shell: pwsh
        run: |
          # Framework-dependent: the executable runs on the .NET 10 Desktop Runtime installed on the PC
          # (a prerequisite). The checks' own results depend on the runner's virtual disks, so only the
          # report's presence is required here: a missing runtime stops the executable before it writes.
          $report = Join-Path $env:RUNNER_TEMP "selfcheck-published.txt"
          $p = Start-Process "publish\DiskMonitor.exe" -ArgumentList @("--self-check", "--output", "`"$report`"") -Wait -PassThru -NoNewWindow
          Get-Content $report
          if (-not (Select-String -Path $report -Pattern "Disk Monitor self-check" -Quiet)) { throw "The executable did not start (exit code $($p.ExitCode))" }
          "Published executable started; self-check exit code $($p.ExitCode)"
      - name: Installer compiles
        shell: pwsh
        run: |
          # Inno Setup is not installed on the development PC; compiling here catches script errors
          # before a release tag does.
          choco install innosetup --no-progress -y | Out-Null
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue)?.Source ?? (Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe")
          & $iscc /Q "/DAppVersion=0.0.0.0" "/DSourceDir=$PWD\publish" "/DOutputDir=$env:RUNNER_TEMP\installer" installer\DiskMonitor.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
          Get-Item "$env:RUNNER_TEMP\installer\DiskMonitor-Setup.exe" | ForEach-Object { "DiskMonitor-Setup.exe: {0:N1} MB" -f ($_.Length / 1MB) }
