name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build DiskMonitor.sln -c Release -nologo
      - name: Test
        run: dotnet test DiskMonitor.sln -c Release --no-build -nologo
      - name: Self-check
        shell: pwsh
        continue-on-error: true
        run: |
          $exe = "src\DiskMonitor\bin\Release\net10.0-windows\win-x64\DiskMonitor.exe"
          $p = Start-Process $exe -ArgumentList '--self-check' -Wait -PassThru -NoNewWindow -RedirectStandardOutput selfcheck.txt
          Get-Content selfcheck.txt
          exit $p.ExitCode
